[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "binance-bot"
version = "0.2.0"
description = "Async Binance market-data layer and event-driven strategy framework (signal/paper mode, no order execution yet)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas Comuni" }]
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "websockets==17.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.8",
]

[project.scripts]
binance-bot = "binance_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/binance_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["binance_bot"]
